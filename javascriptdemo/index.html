        <div id="result"></div>

        <script>
            //this statement prints text to the screen
            document.write("Hello World!" + "<br>");
            //create variable
            var value1 = 50;
            var value2 = 60;
            var sum = value1 + value2;
            document.write(sum + "<br>");
            //connect two words togther, this is called concatenation
            var string1 = "Chocolate";
            var string2 = "Brownie";
            document.write( string1 + string2 + "<br>");
            //select an HTML and manipulate it
            document.getElementById("result").innerHTML = "WHAZZZUUUUPPPP!!!!";
            document.getElementById("result").innerText = "HELLOOOO!!!";
            //select an HTML element by Id and its style
            document.getElementById("result").style = "color: red; font-weight:bold; font-size: 30px";
            //alert
            window.alert("HEY WATCH OUT!!!");


        </script>
